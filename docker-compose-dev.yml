services:
  front:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    command: bun run dev --host 0.0.0.0 --port 5173
    ports:
      - "${DOCKER_FRONT_PORT:-5174}:5173"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8081}"
    volumes:
      - .:/app
      - /app/node_modules
