name: Owner approval

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  contents: read
  pull-requests: read

jobs:
  approval:
    name: Owner approval
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require the owner for external contributions
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$PR_AUTHOR" == "ogrre" ]]; then
            echo "Pull request opened by the repository owner."
            exit 0
          fi

          approval_count=$(gh api \
            --paginate \
            "repos/$REPOSITORY/pulls/$PR_NUMBER/reviews" \
            --jq '[.[] | select(.user.login == "ogrre" and .state == "APPROVED")] | length' \
            | awk '{ total += $1 } END { print total + 0 }')

          if [[ "$approval_count" -lt 1 ]]; then
            echo "A review approval from ogrre is required for external contributions."
            exit 1
          fi

          echo "The repository owner approved this pull request."
